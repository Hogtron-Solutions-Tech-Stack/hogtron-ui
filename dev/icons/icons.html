<!doctype html><html><head><style>
body{margin:0;background:transparent}

<!-- HogHeals quest icons. Brand: ink #121217, cream #F5EBDC, cyan #21D4E0, amber #F2A626. Rendered at 256 px, the
     build script downsamples to 64 px TGA. Thick dark outer ring = readable on bright minimap grass and snow. -->

  <defs>
    <radialGradient id="inkg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#2a2a33"/><stop offset="1" stop-color="#0d0d11"/></radialGradient>

  </defs>
  <circle cx="128" cy="128" r="118" fill="#050507"/>
  <circle cx="128" cy="128" r="106" fill="url(#amb)"/>
  <circle cx="128" cy="128" r="88" fill="url(#inkg)"/>
  <rect x="110" y="56" width="36" height="96" rx="18" fill="url(#amb)" stroke="#050507" stroke-width="6"/>
  <circle cx="128" cy="184" r="20" fill="url(#amb)" stroke="#050507" stroke-width="6"/>
</svg>

  </defs>

  <circle cx="128" cy="128" r="106" fill="url(#amb2)"/>

  <path d="M86 98 C86 64 108 48 130 48 C156 48 174 66 174 90 C174 112 158 122 146 130 C138 136 136 140 136 152 L120 152 C120 134 124 124 138 114 C150 106 156 100 156 90 C156 76 146 66 130 66 C114 66 104 78 104 98 Z"

</svg>

</svg>

  <path d="M40 40 L216 128 L40 216 Z" fill="#ffffff" stroke="#050507" stroke-width="18" stroke-linejoin="round"/>
</svg>
