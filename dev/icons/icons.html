<!doctype html><html><head><style>
body{margin:0;background:transparent}
.i{width:256px;height:256px;display:inline-block}
</style></head><body>
<!-- HogHeals quest icons. Brand: ink #121217, cream #F5EBDC, cyan #21D4E0, amber #F2A626. Rendered at 256 px, the
     build script downsamples to 64 px TGA. Thick dark outer ring = readable on bright minimap grass and snow. -->
<svg id="quest_open" class="i" viewBox="0 0 256 256">
  <defs>
    <radialGradient id="inkg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#2a2a33"/><stop offset="1" stop-color="#0d0d11"/></radialGradient>
    <linearGradient id="amb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD16B"/><stop offset="1" stop-color="#E88A0C"/></linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="#050507"/>
  <circle cx="128" cy="128" r="106" fill="url(#amb)"/>
  <circle cx="128" cy="128" r="88" fill="url(#inkg)"/>
  <rect x="110" y="56" width="36" height="96" rx="18" fill="url(#amb)" stroke="#050507" stroke-width="6"/>
  <circle cx="128" cy="184" r="20" fill="url(#amb)" stroke="#050507" stroke-width="6"/>
</svg>
<svg id="quest_done" class="i" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="amb2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD978"/><stop offset="1" stop-color="#E5850A"/></linearGradient>
  </defs>
  <circle cx="128" cy="128" r="118" fill="#050507"/>
  <circle cx="128" cy="128" r="106" fill="url(#amb2)"/>
  <ellipse cx="128" cy="86" rx="70" ry="34" fill="#ffffff" opacity="0.18"/>
  <path d="M86 98 C86 64 108 48 130 48 C156 48 174 66 174 90 C174 112 158 122 146 130 C138 136 136 140 136 152 L120 152 C120 134 124 124 138 114 C150 106 156 100 156 90 C156 76 146 66 130 66 C114 66 104 78 104 98 Z"
        fill="#121217" stroke="#121217" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="128" cy="186" r="18" fill="#121217"/>
</svg>
<svg id="quest_arrow" class="i" viewBox="0 0 256 256">
  <defs><linearGradient id="amb3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD16B"/><stop offset="1" stop-color="#E88A0C"/></linearGradient></defs>
  <path d="M128 22 L214 206 L128 164 L42 206 Z" fill="url(#amb3)" stroke="#050507" stroke-width="16" stroke-linejoin="round"/>
  <path d="M128 60 L128 150" stroke="#ffffff" stroke-opacity="0.25" stroke-width="10" stroke-linecap="round"/>
</svg>
</body></html>
